name: Bump @openrouter/sdk

# HOP A of the SDK release chain. Triggered by typescript-sdk after it publishes
# a new @openrouter/sdk to npm. Opens a PR bumping the dependency in
# packages/agent, lets Perry + CI run, then auto-merges on green (or alerts and
# leaves the PR red on failure). Merging the PR feeds the changesets release
# flow in publish.yaml, which cuts a new @openrouter/agent and dispatches HOP B.

on:
  repository_dispatch:
    types: [openrouter-sdk-published]
  workflow_dispatch:
    inputs:
      version:
        description: "@openrouter/sdk version to bump to (blank = npm latest)"
        required: false
        type: string
      dry_run:
        description: "Open the PR and run the gate, but do not merge"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-openrouter-sdk
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.bump.outputs.branch }}
      noop: ${{ steps.bump.outputs.noop }}
      pr_number: ${{ steps.open.outputs.pr_number }}
    steps:
      # No credentials persisted: the prepare phase below runs `pnpm install`,
      # which executes dependency lifecycle scripts that must not be able to
      # read a write-capable token out of .git/config (same reasoning as
      # publish.yaml's checkout). The App token is minted only after that
      # phase and passed per-command to the push.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve target version
        id: ver
        run: |
          set -euo pipefail
          V="${{ github.event.client_payload.version || github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="$(npm view @openrouter/sdk version)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Target @openrouter/sdk version: $V"

      # Phase 1: edit + relock + changeset + local commit. Runs pnpm install
      # (lifecycle scripts) — deliberately tokenless.
      - name: Bump, relock, changeset (no token)
        id: bump
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
          PHASE: prepare
        run: |
          chmod +x .github/scripts/bump-sdk.sh
          ./.github/scripts/bump-sdk.sh

      # Short-lived App token (same App as publish.yaml / release-train.yaml),
      # minted only now that lifecycle scripts are done. An App token (not the
      # Actions GITHUB_TOKEN) so the opened PR triggers Perry + CI —
      # GITHUB_TOKEN would suppress those downstream runs. Replaces the
      # GH_TOKEN PAT the enterprise lifetime policy killed.
      - name: Mint release-bot token
        id: app-token
        if: steps.bump.outputs.noop != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: OpenRouterTeam
          repositories: typescript-agent

      # Same mint-failure paging as publish.yaml / release-train.yaml: this
      # workflow is repository_dispatch-driven with nobody watching the run,
      # so a broken App credential must page, not just redden the Actions UI.
      - name: Alert if token minting failed
        if: steps.bump.outputs.noop != 'true' && steps.app-token.outcome != 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CI_RELEASE_ALERT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.CI_RELEASE_ALERT_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TEXT=":rotating_light: SDK bump: could not mint the release-bot App token (RELEASE_BOT_APP_ID/RELEASE_BOT_PRIVATE_KEY missing or App uninstalled?). The @openrouter/sdk bump chain is stalled. <${RUN_URL}|run>"
          echo "::error::App token minting failed — SDK bump chain stalled."
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ]; then
            curl -fsS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json; charset=utf-8" \
              --data "$(python3 -c "import json,sys; print(json.dumps({'channel':sys.argv[1],'unfurl_links':False,'text':sys.argv[2]}))" "$SLACK_CHANNEL_ID" "$TEXT")" \
              >/dev/null || echo "::warning::Slack post failed"
          else
            echo "(slack not configured; would have posted) $TEXT"
          fi
          exit 1

      # Phase 2: close superseded PRs + push. Token passed per-command; never
      # persisted to .git/config.
      - name: Close prior PRs, push branch
        if: steps.bump.outputs.noop != 'true'
        env:
          TARGET_VERSION: ${{ steps.ver.outputs.version }}
          PHASE: remote
          BRANCH: ${{ steps.bump.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./.github/scripts/bump-sdk.sh

      - name: Open PR
        id: open
        if: steps.bump.outputs.noop != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_URL=$(gh pr create \
            --repo OpenRouterTeam/typescript-agent \
            --base main \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "chore: bump @openrouter/sdk to ${{ steps.ver.outputs.version }}" \
            --body "$(cat <<'EOF'
          Automated bump of `@openrouter/sdk` from the SDK release chain.

          Source: ${{ github.event.client_payload.source_run_url || github.event.inputs.version && 'manual workflow_dispatch' }}

          This PR will be auto-merged once Perry and CI pass. On failure it is
          left open for a human. [sdk-bot]
          EOF
          )")
          echo "Created $PR_URL"
          echo "pr_number=$(echo "$PR_URL" | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"

  gate:
    needs: bump
    if: needs.bump.outputs.noop != 'true' && needs.bump.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      # Minted per-job: installation tokens cannot be passed between jobs
      # (GitHub drops job outputs that contain secrets), and the bump job's
      # token may expire during a long gate anyway (1h lifetime, 30m poll).
      - name: Mint release-bot token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: OpenRouterTeam
          repositories: typescript-agent

      # Same mint-failure paging as the bump job above: at this point a bump
      # PR is already open and unmerged, so a silent stall leaves it dangling.
      - name: Alert if token minting failed
        if: steps.app-token.outcome != 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CI_RELEASE_ALERT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.CI_RELEASE_ALERT_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ needs.bump.outputs.pr_number }}
        run: |
          set -euo pipefail
          TEXT=":rotating_light: SDK bump: could not mint the App token for the gate job — PR #${PR} is open but ungated/unmerged. Merge it manually or re-run after fixing the App credentials. <${RUN_URL}|run>"
          echo "::error::App token minting failed — bump PR #${PR} left ungated."
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ]; then
            curl -fsS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json; charset=utf-8" \
              --data "$(python3 -c "import json,sys; print(json.dumps({'channel':sys.argv[1],'unfurl_links':False,'text':sys.argv[2]}))" "$SLACK_CHANNEL_ID" "$TEXT")" \
              >/dev/null || echo "::warning::Slack post failed"
          else
            echo "(slack not configured; would have posted) $TEXT"
          fi
          exit 1

      - name: Wait for CI, then merge or alert
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ needs.bump.outputs.pr_number }}
          REPO: OpenRouterTeam/typescript-agent
          AUTO_MERGE: ${{ github.event.inputs.dry_run != 'true' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_BOT_TOKEN: ${{ secrets.CI_RELEASE_ALERT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.CI_RELEASE_ALERT_SLACK_CHANNEL_ID }}
        run: |
          chmod +x .github/scripts/pr-gate.sh
          ./.github/scripts/pr-gate.sh
