name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: >
          Release mode:
          - "version" — Creates a "Version Packages" PR that bumps versions and
            updates each package's CHANGELOG.md based on pending changesets. Run
            this first.
          - "publish" — Publishes every package whose on-disk version differs
            from npm, with provenance. Only run this AFTER the Version Packages
            PR has been merged to main.
            Note: merging that PR normally publishes on its own, because this
            workflow also runs on push to main. This mode is for retrying or
            forcing a publish, not a required second step.
          NOTE: @openrouter/agent releases must be coordinated with @openrouter/sdk
          because callModel changes are typically coupled with SDK type changes.
        required: true
        type: choice
        options:
          - version
          - publish
        default: version
      dry-run:
        description: >
          Dry run: If enabled, simulates the publish without making any changes.
          Useful for verifying what would publish before committing to a release.
        required: false
        type: boolean
        default: false

permissions:
  contents: write # For creating releases and the Version Packages PR
  pull-requests: write # For creating/updating the Version Packages PR
  id-token: write # For npm trusted publishing (OIDC) + provenance signing

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    # Only publish from main, and allow dry-run diagnostics from any branch
    # (that leg never reaches the OIDC exchange, so it cannot publish).
    #
    # This guards against *accidents*, not a determined actor: workflow_dispatch
    # runs the workflow file from the selected ref, so a branch whose copy drops
    # this line would ignore it. The only server-side ref restriction is the
    # `npm-publish` environment's deployment branch policy, which is currently
    # unset — and under OIDC that is the real control, because npm's trusted
    # publisher pins org/repo/workflow-filename/environment and carries no
    # branch or ref claim. Setting that policy to `main` is the actual fix.
    #
    # The off-main exemption is scoped to mode=publish + dry-run specifically.
    # `dry-run` alone is not enough: with mode=version the changesets step runs
    # with `publish:` wired up and ignores dry-run entirely, so `dry-run: true`
    # from a feature branch could still publish for real.
    if: >
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'publish' && inputs.dry-run)
    steps:
      # No credentials persisted: install/build/test below execute dependency
      # lifecycle scripts and test code, which must not be able to read the
      # cross-repo App token out of .git/config. Push credentials are injected
      # by the "Configure git push credentials" step *after* those,
      # immediately before the only steps that push.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # npm trusted publishing (OIDC) requires npm >= 11.5.1, which means Node
      # 24 — Node 22 ships npm 10.x, which has no OIDC token-exchange support at
      # all and fails with ENEEDAUTH/E404. `pnpm publish` shells out to whichever
      # `npm` is on PATH, so the Node version here is what performs the exchange.
      #
      # `registry-url` is deliberately omitted: it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # and with no NODE_AUTH_TOKEN set that placeholder is left unexpanded and
      # sent to the registry as a literal bearer token, breaking the `npm info`
      # lookups changesets performs before publishing. npm's OIDC flow sets the
      # auth token itself once the trusted publisher matches.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Fail fast with an actionable message if the runner's npm cannot do the
      # OIDC exchange. Without this, an npm downgrade (e.g. someone lowers
      # node-version) surfaces as a cryptic `E404 PUT` or `ENEEDAUTH` at publish
      # time, which is what made the original breakage hard to diagnose.
      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version) / npm ${NPM_VERSION}"
          if [ "$(printf '%s\n' "11.5.1" "${NPM_VERSION}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_VERSION} cannot use trusted publishing (OIDC); npm >= 11.5.1 is required. Raise node-version in this workflow."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test

      # Short-lived GitHub App installation token replacing the old GH_TOKEN
      # PAT (which the OpenRouter enterprise now rejects for lifetime > 366
      # days — the failure that silently stalled releases in Aug 2026). Same
      # pattern as the port repos' openrouter-port-bot. Expires after 1 hour
      # and is auto-revoked at job end, so the exfiltration surface the PAT
      # reviews worried about shrinks to a job-scoped credential.
      #
      # Two tokens, deliberately: the release itself must never depend on the
      # HOP dispatch targets. This one is scoped to THIS repo only and gates
      # the publish path (fails loudly if the App/installation is missing).
      # The cross-repo dispatch token below is minted separately, best-effort,
      # matching the HOP steps' own "must not fail the release" contract.
      #
      # Known constraint: App tokens cannot push changes under
      # .github/workflows/ without the App also granting `workflows: write`
      # (the push is rejected with "refusing to allow a GitHub App to create
      # or update workflow"). The Version PR and SDK-bump branches never
      # touch workflow files today; if one ever must, grant that permission
      # on the App rather than working around the rejected push.
      # Skipped only on the mode=publish dry-run leg: that leg publishes
      # nothing, pushes nothing, and dispatches nothing, so a broken App
      # setup must not block it — it's the diagnostic escape hatch you'd
      # reach for while fixing exactly that. NOT skipped on mode=version +
      # dry-run: the changesets step ignores dry-run entirely (see the job
      # `if` comment) and runs for real, so it needs the real token.
      - name: Mint release-bot token
        id: app-token
        if: ${{ !(inputs.dry-run && inputs.mode == 'publish') }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: OpenRouterTeam
          repositories: typescript-agent

      # Deliberately after install/build/test (see the checkout comment).
      # changesets/action pushes changeset-release/main (and release tags on
      # the publish leg) with plain `git push`, which uses the remote's
      # embedded credentials. It must be the App token, not the Actions
      # GITHUB_TOKEN: GITHUB_TOKEN-attributed pushes never trigger workflows,
      # so Version PR updates would get no CI / perry/review and the release
      # train (release-train.yaml) could merge on checks from the first
      # revision. App-token pushes trigger workflows normally.
      - name: Configure git push credentials (App token)
        if: ${{ !(inputs.dry-run && inputs.mode == 'publish') }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Version PR or Publish (changesets)
        id: changesets
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'version')
        # SHA-pinned (= v1.9.0): this step receives the cross-repo App token
        # and runs with it in .git/config, so a floating tag would let a
        # compromised action release exfiltrate it (bounded to the token's
        # 1-hour lifetime, but still). Bump deliberately.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          # `pnpm run version`, not `changeset version` directly: the bump has
          # to be followed by `turbo run gen:version` so committed generated
          # files (packages/mcp/src/version.ts) are regenerated in the same
          # commit. Otherwise the Version PR ships a package.json at the new
          # version and a version.ts at the old one, and version.test.ts fails
          # on it — turbo's `test` task uses `dependsOn: ["^build"]`, which
          # builds upstream deps only, so nothing regenerates it at test time.
          version: pnpm run version
          publish: pnpm exec changeset publish --no-git-checks
        env:
          # App token, not the Actions GITHUB_TOKEN: PRs created with
          # GITHUB_TOKEN never trigger other workflows, so the Version Packages
          # PR would get no CI and no perry/review — and the release-train
          # workflow (release-train.yaml) gates its auto-merge on exactly those
          # checks. Same reasoning as in bump-openrouter-sdk.yaml.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # No NODE_AUTH_TOKEN / NPM_TOKEN: auth comes from OIDC trusted
          # publishing. changesets/action logs "No NPM_TOKEN found, but OIDC is
          # available" and leaves .npmrc alone; npm then exchanges the Actions
          # ID token for a short-lived, package-scoped publish token.

      # Record the npm version before a manual publish so the dispatch step can
      # tell whether this run actually published a new @openrouter/agent (the
      # changesets/action `published` output only exists for the push /
      # mode=version path, not this manual one).
      - name: Capture pre-publish version (manual publish)
        id: pre-publish
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && !inputs.dry-run
        run: echo "version=$(npm view @openrouter/agent version)" >> "$GITHUB_OUTPUT"

      - name: Publish (workflow_dispatch, live)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && !inputs.dry-run
        run: pnpm exec changeset publish --no-git-checks

      # `changeset publish` only creates release tags locally; on the push path
      # changesets/action pushes them, but nothing does here. Push them so the
      # HOP C dispatch below names a ref the port repos can actually resolve.
      #
      # Best-effort: the packages are already on npm by the time this runs, so a
      # rejected push (tag protection ruleset, or a re-run where the tag exists
      # on origin at a different commit) must not turn a successful publish red
      # — and must not skip the HOP B/C dispatch steps below. HOP C independently
      # verifies the tag is on the remote and falls back to the commit SHA.
      - name: Push release tags (manual publish)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && !inputs.dry-run
        continue-on-error: true
        run: git push origin --tags

      # Nothing below pushes via git (the HOP dispatches use `gh api` with
      # the App token from env), so drop it from .git/config the moment the
      # last push consumer is done. `always()`: scrub even when a publish
      # step failed, since later/rerun steps still see the workspace. The
      # token also expires on its own within the hour; this just narrows the
      # in-job window.
      - name: Scrub git push credentials
        if: always()
        run: |
          git remote set-url origin \
            "https://github.com/${{ github.repository }}.git"

      # `changeset publish` has no native --dry-run. Fall back to pnpm's
      # recursive dry-run, which simulates publishing every workspace package
      # rather than only the ones changesets would pick. Output set may be
      # wider than the live publish — but nothing is actually published, so
      # this is only a diagnostic preview.
      #
      # Dry runs never reach the OIDC exchange, so they cannot verify auth —
      # they only confirm which tarballs would go out.
      - name: Publish (workflow_dispatch, dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && inputs.dry-run
        run: pnpm -r publish --dry-run --access public --no-git-checks

      # Cross-repo token for the HOP B/C dispatches only. Minted separately
      # from the publish token and best-effort (continue-on-error): the
      # packages are already on npm when the dispatches run, so a repo missing
      # from the App installation must degrade to a skipped notification with
      # a warning — exactly like a failed dispatch — never a red release.
      # One narrowly-scoped token PER dispatch target, each best-effort.
      # Not one shared mint: an explicit multi-repo list is all-or-nothing
      # (one uninstalled port repo kills the unrelated monorepo notification
      # too), and an owner-wide mint hands the job a token for every repo the
      # App is installed on. Per-target mints get both properties — a missing
      # target degrades only its own notification, and each token can touch
      # exactly one repo.
      - name: Mint dispatch token (openrouter-web)
        id: web-token
        if: ${{ !cancelled() && !inputs.dry-run }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: OpenRouterTeam
          repositories: openrouter-web

      - name: Mint dispatch token (python-agent)
        id: py-token
        if: ${{ !cancelled() && !inputs.dry-run }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: OpenRouterTeam
          repositories: python-agent

      - name: Mint dispatch token (go-agent)
        id: go-token
        if: ${{ !cancelled() && !inputs.dry-run }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: OpenRouterTeam
          repositories: go-agent

      # Degraded ≠ silent: annotations alone are invisible on a green
      # scheduled run, so also page the release-alert channel (no-op until
      # the CI_RELEASE_ALERT_* secrets exist, like the train's alerts).
      - name: Warn about unavailable dispatch tokens
        if: ${{ !cancelled() && !inputs.dry-run && (steps.web-token.outcome == 'failure' || steps.py-token.outcome == 'failure' || steps.go-token.outcome == 'failure') }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CI_RELEASE_ALERT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.CI_RELEASE_ALERT_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MISSING=""
          [ "${{ steps.web-token.outcome }}" = "failure" ] && { echo "::warning::No dispatch token for openrouter-web — its HOP B notification will be skipped."; MISSING="$MISSING openrouter-web"; }
          [ "${{ steps.py-token.outcome }}" = "failure" ] && { echo "::warning::No dispatch token for python-agent — its HOP C notification will be skipped."; MISSING="$MISSING python-agent"; }
          [ "${{ steps.go-token.outcome }}" = "failure" ] && { echo "::warning::No dispatch token for go-agent — its HOP C notification will be skipped."; MISSING="$MISSING go-agent"; }
          TEXT=":warning: Release publish: could not mint dispatch token(s) for${MISSING} (App not installed there?). Their release notifications were skipped — trigger downstream flows manually. <${RUN_URL}|run>"
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ]; then
            curl -fsS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-type: application/json; charset=utf-8" \
              --data "$(python3 -c "import json,sys; print(json.dumps({'channel':sys.argv[1],'unfurl_links':False,'text':sys.argv[2]}))" "$SLACK_CHANNEL_ID" "$TEXT")" \
              >/dev/null || echo "::warning::Slack post failed"
          else
            echo "(slack not configured; would have posted) $TEXT"
          fi

      # HOP B trigger: when @openrouter/agent is actually published, tell the
      # monorepo (openrouter-web) to bump its pinned @openrouter/agent for
      # server tools. Two publish paths produce a real publish:
      #   1. changesets/action on push (Version PR merged) → `published` output
      #   2. manual workflow_dispatch mode=publish → detect via npm version diff
      - name: Resolve published @openrouter/agent version
        id: published
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          VERSION=""

          # Path 1: changesets/action publish leg.
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            VERSION=$(printf '%s' '${{ steps.changesets.outputs.publishedPackages }}' \
              | python3 -c "import sys,json; pkgs=json.load(sys.stdin); print(next((p['version'] for p in pkgs if p['name']=='@openrouter/agent'), ''))")
          fi

          # Path 2: manual live publish — compare npm version before/after.
          if [ -z "$VERSION" ] && [ -n "${{ steps.pre-publish.outputs.version }}" ]; then
            AFTER="$(npm view @openrouter/agent version)"
            if [ "$AFTER" != "${{ steps.pre-publish.outputs.version }}" ]; then
              VERSION="$AFTER"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "Published @openrouter/agent $VERSION"
          else
            echo "No new @openrouter/agent publish detected — no dispatch"
          fi

      # continue-on-error for the same reason as HOP C: the packages are on
      # npm by now, and a missing openrouter-web installation surfaces as a
      # skipped mint / 404 — degrade with a warning, never a red release.
      - name: Dispatch monorepo bump
        if: ${{ !inputs.dry-run && steps.published.outputs.version != '' && steps.web-token.outcome == 'success' }}
        continue-on-error: true
        env:
          # openrouter-web-scoped App token; its contents:write is what makes
          # the repository_dispatch accepted.
          GH_TOKEN: ${{ steps.web-token.outputs.token }}
          SLACK_BOT_TOKEN: ${{ secrets.CI_RELEASE_ALERT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.CI_RELEASE_ALERT_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # if/else rather than a bare call: under continue-on-error a bare
          # failure leaves a green job with no annotation — the warning +
          # Slack page are what make the dropped notification visible (same
          # pattern as the per-repo loop in the HOP C step).
          if gh api repos/OpenRouterTeam/openrouter-web/dispatches \
               -f event_type=openrouter-agent-published \
               -F "client_payload[version]=${{ steps.published.outputs.version }}" \
               -F "client_payload[source_run_url]=${RUN_URL}"; then
            echo "Dispatched openrouter-agent-published (version ${{ steps.published.outputs.version }}) to openrouter-web"
          else
            echo "::warning::Failed to dispatch openrouter-agent-published to openrouter-web. Bump its pinned @openrouter/agent manually or re-dispatch from its own workflow."
            TEXT=":warning: Release publish: @openrouter/agent ${{ steps.published.outputs.version }} shipped but the openrouter-web bump dispatch failed — bump it manually. <${RUN_URL}|run>"
            if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ]; then
              curl -fsS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                -H "Content-type: application/json; charset=utf-8" \
                --data "$(python3 -c "import json,sys; print(json.dumps({'channel':sys.argv[1],'unfurl_links':False,'text':sys.argv[2]}))" "$SLACK_CHANNEL_ID" "$TEXT")" \
                >/dev/null || echo "::warning::Slack post failed"
            else
              echo "(slack not configured; would have posted) $TEXT"
            fi
          fi

      # HOP C trigger: tell the Python and Go ports of @openrouter/agent that a
      # new version shipped, so each opens a PR porting the delta. Those repos run
      # Upstreamer against this repo as their reference spec (see their
      # .upstreamer/upstreamer.md) and gate the result on a mechanical verifier
      # plus a parity eval before advancing their sync state.
      #
      # Deliberately release-triggered rather than a cron over this repo's main:
      # ports track published versions, so the delta they see always lands on a
      # release boundary instead of a mid-flight commit.
      #
      # `ref` is the release tag changesets created, so a port reproduces the exact
      # published tree rather than whatever main has drifted to since. If that tag
      # never reached origin, the step falls back to this run's commit SHA — same
      # tree, still resolvable.
      #
      # This step must not fail the release: the packages are already on npm by
      # now, so a red job here would misreport a successful publish. A failed
      # dispatch is a warning — re-run it from the port repo's own
      # "Upstreamer Port" workflow (workflow_dispatch), or let its weekly cron
      # pick the change up.
      #
      # `!cancelled()` keeps this independent of the HOP B step above: a failed
      # monorepo dispatch should not also stop the ports from being told.
      - name: Dispatch port repos
        if: ${{ !cancelled() && !inputs.dry-run && steps.published.outputs.version != '' }}
        continue-on-error: true
        env:
          # The tag lookup reads THIS repo, so it uses the typescript-agent-
          # scoped publish token; each dispatch uses its own target-scoped
          # token (empty when that repo's mint failed → skipped with warning).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PY_TOKEN: ${{ steps.py-token.outputs.token }}
          GO_TOKEN: ${{ steps.go-token.outputs.token }}
          VERSION: ${{ steps.published.outputs.version }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="@openrouter/agent@${VERSION}"
          FAILED=""

          # The tag is only usable as a ref if it actually reached origin. On the
          # push path changesets/action pushes it; on the manual publish path the
          # push is best-effort and may have been rejected or skipped. Dispatching
          # an unresolvable ref would make the ports fail on checkout rather than
          # degrade, so fall back to this run's commit SHA — which points at the
          # same published tree.
          #
          # gh api rather than `git ls-remote origin`: the credential scrub above
          # leaves origin tokenless, so a git-side lookup would silently fail if
          # this repo ever goes private and the fallback would fire every time.
          # gh authenticates from GH_TOKEN in env, independent of .git/config.
          ENCODED_TAG="$(jq -rn --arg t "$TAG" '$t|@uri')"
          if gh api "repos/${{ github.repository }}/git/ref/tags/${ENCODED_TAG}" >/dev/null 2>&1; then
            REF="$TAG"
          else
            REF="${{ github.sha }}"
            echo "::warning::${TAG} is not on origin; dispatching ref=${REF} instead."
          fi

          for ENTRY in "python-agent:${PY_TOKEN}" "go-agent:${GO_TOKEN}"; do
            REPO="${ENTRY%%:*}"
            TOKEN="${ENTRY#*:}"
            if [ -z "$TOKEN" ]; then
              echo "::warning::No token for OpenRouterTeam/${REPO} (mint skipped/failed) — not dispatching. Trigger its Upstreamer Port workflow manually with ref=${REF}, or wait for its weekly cron."
              FAILED="$FAILED ${REPO}"
              continue
            fi
            # -f (--raw-field) everywhere: -F treats values starting with `@`
            # (like TAG) as filenames to read, which would error out before the
            # request is even sent.
            if GH_TOKEN="$TOKEN" gh api "repos/OpenRouterTeam/${REPO}/dispatches" \
                 -f event_type=openrouter-agent-published \
                 -f "client_payload[version]=${VERSION}" \
                 -f "client_payload[ref]=${REF}" \
                 -f "client_payload[source_run_url]=${SOURCE_RUN_URL}"; then
              echo "Dispatched openrouter-agent-published (ref ${REF}) to ${REPO}"
            else
              echo "::warning::Failed to dispatch to OpenRouterTeam/${REPO}. Trigger its Upstreamer Port workflow manually with ref=${REF}, or wait for its weekly cron."
              FAILED="$FAILED ${REPO}"
            fi
          done

          # Report, but never fail the release — npm is already updated.
          if [ -n "$FAILED" ]; then
            echo "Port dispatch incomplete:$FAILED"
          fi
